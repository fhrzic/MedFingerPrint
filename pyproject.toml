[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MedFingerPrint"
version = "0.1.0"
description = "Fingerprinting framework for medical imaging datasets (CT, X-ray, 2D/3D)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Franko Hržić" }]
readme = "README.md"
dependencies = [
    "numpy", "scipy", "pandas", "SimpleITK", "pydicom", "tifffile", "pillow",
    "pyyaml", "matplotlib", "reportlab", "scikit-learn",
]

[project.optional-dependencies]
gui = ["PySide6", "pyqtgraph"]
dev = ["pytest", "nibabel"]

[project.scripts]
mfp = "medfingerprint.cli:main"

[tool.setuptools.packages.find]
include = ["medfingerprint*"]

[tool.setuptools.package-data]
medfingerprint = ["presets/*.yaml"]

[project.urls]
Homepage = "https://github.com/fhrzic/MedFingerPrint"
